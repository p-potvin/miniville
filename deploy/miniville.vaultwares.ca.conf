# miniville.vaultwares.ca - Miniville town observer (10-foot TV mode), tailnet-only
# Proxies to the miniville observer on clopeux-desktop (100.71.101.21:8751).
# Installed: Mon, 19 Oct 2026. Same shape as tubelab/music: public 80 for ACME,
# everything else tailnet-only.

server {
    listen 80;
    listen [::]:80;
    server_name miniville.vaultwares.ca;
    include snippets/acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name miniville.vaultwares.ca;

    # Tailnet only: the public name resolves here too, everyone else gets 403.
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny all;

    ssl_certificate /etc/letsencrypt/live/miniville.vaultwares.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniville.vaultwares.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # The observer is a live, polling dashboard (and the TV director steps the
    # town in the background), so keep proxying snappy.
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://100.71.101.21:8751;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }
}